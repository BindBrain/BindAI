[project]
name = "bindai-provider-google"
version = "0.1.0"
description = "Google Gemini provider for BindAI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "google-genai>=2.22.0",
    "bindai-core",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."bindai.providers"]

google = "bindai_provider_google:register"