[project]
name = "bindai-provider-openai"
version = "0.1.0"
description = "OpenAI provider for BindAI"
requires-python = ">=3.11"

dependencies = [
    "openai>=1.99.0",
    "bindai-core",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]