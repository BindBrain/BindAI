[project]
name = "bindai-provider-ollama"
version = "0.1.0"
description = "Ollama provider for BindAI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "ollama>=0.6.2",
    "bindai-core",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."bindai.providers"]
ollama = "bindai_provider_ollama:register"