[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "bindai-connections"
version = "0.1.0"
description = "Connections and integrations package for BindAI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "bindai-core",
]

[tool.setuptools.packages.find]
where = [
    "src"
]