[project]
name = "bindai-group"
version = "0.2.0"
description = "BindAI Groups"
requires-python = ">=3.11"

dependencies = [
    "bindai-agent",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]