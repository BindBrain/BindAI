[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bindai-project"
version = "0.1.1"
description = "BindAI Project"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "bindai-config>=0.2.0",
    "bindai-workflow>=0.2.1",
    "bindai-agent>=0.2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bindai_project = [
    "scaffolds/**/*",
    "scaffolds/**/.*",
]
