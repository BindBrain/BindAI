[project]
name = "bindai-automation"
version = "0.1.0"
description = "BindAI Automation and Trigger Framework"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "bindai-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindai_automation"]