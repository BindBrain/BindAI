[project]
name = "bindai-agent"
version = "0.1.1"
requires-python = ">=3.12"

dependencies = [
    "bindai-core",
    "bindai-config",
    "bindai-memory",
    "bindai-prompts",
    "bindai-prompt-builder",
    "bindai-providers",
    "bindai-provider-openai",
    "bindai-tool",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
