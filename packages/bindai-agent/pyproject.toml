[project]
name = "bindai-agent"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "bindai-core",
    "bindai-prompts",
    "bindai-providers",
    "bindai-provider-openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]