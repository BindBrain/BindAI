[project]
name = "bindai-config"
version = "0.1.0"
description = "BindAI Configuration"
requires-python = ">=3.11"

dependencies = [
    "PyYAML",
    "bindai",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]