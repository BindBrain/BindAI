[project]
name = "bindai-providers"
version = "0.1.1"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "bindai-core",
    "bindai-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindai_providers"]
