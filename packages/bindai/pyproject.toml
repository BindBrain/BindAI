[project]
name = "bindai"
version = "0.1.0"
description = "BindAI Framework"
requires-python = ">=3.12"

dependencies = [
    "bindai-core",
    "bindai-agent",
    "bindai-application",
    "bindai-config",
    "bindai-group",
    "bindai-knowledge",
    "bindai-memory",
    "bindai-model",
    "bindai-project",
    "bindai-runtime",
    "bindai-task",
    "bindai-workflow",

    "bindai-prompt-builder",
    "bindai-retrieval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindai"]