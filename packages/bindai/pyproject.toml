[project]
name = "bindai"
version = "0.1.0"
description = "BindAI Framework"
requires-python = ">=3.11"

dependencies = [
    "bindai-core",
    "bindai-agent",
    "bindai-application",
    "bindai-config",
    "bindai-group",
    "bindai-knowledge",
    "bindai-memory",
    "bindai-model",
    "bindai-project",
    "bindai-runtime",
    "bindai-task",
    "bindai-workflow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]