[project]
name = "bindai-runtime"
version = "0.1.0"
description = "BindAI Runtime"

requires-python = ">=3.12"

dependencies = [
    "bindai-core",
    "bindai-task",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindai_runtime"]