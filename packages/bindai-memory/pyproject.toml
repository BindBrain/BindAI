[project]
name = "bindai-memory"
version = "0.1.0"
description = "BindAI Memory"
requires-python = ">=3.11"

dependencies = [
    "bindai-core",
    "bindai-embeddings",
    "pinecone>=7.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]