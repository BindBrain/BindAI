[project]
name = "bindai-memory"
version = "0.1.1"
description = "BindAI Memory"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "bindai-core",
    "bindai-embeddings",
    "pinecone>=7.0",
    "chromadb>=1.5.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]