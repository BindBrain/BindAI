[project]
name = "bindai-knowledge"
version = "0.1.4"
description = "Knowledge module for BindAI"
requires-python = ">=3.12"

dependencies = [
    "pypdf>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bindai_knowledge"]
