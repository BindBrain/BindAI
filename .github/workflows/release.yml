name: Release

on:
  release:
    types:
      - published

jobs:
  publish-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-agent
        run: |
          uv build --package bindai-agent --no-sources --out-dir dist

      - name: Publish bindai-agent to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-bindai:
    runs-on: ubuntu-latest
    needs: publish-agent

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai
        run: |
          uv build --package bindai --no-sources --out-dir dist

      - name: Publish bindai to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-cli:
    runs-on: ubuntu-latest
    needs: publish-bindai

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-cli
        run: |
          uv build --package bindai-cli --no-sources --out-dir dist

      - name: Publish bindai-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-automation:
    runs-on: ubuntu-latest
    needs: publish-bindai

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-automation
        run: |
          uv build --package bindai-automation --no-sources --out-dir dist

      - name: Publish bindai-automation to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-connections:
    runs-on: ubuntu-latest
    needs: publish-bindai

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-connections
        run: |
          uv build --package bindai-connections --no-sources --out-dir dist

      - name: Publish bindai-connections to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    runs-on: ubuntu-latest
    needs: publish-bindai

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-mcp
        run: |
          uv build --package bindai-mcp --no-sources --out-dir dist

      - name: Publish bindai-mcp to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-api:
    runs-on: ubuntu-latest
    needs:
      - publish-bindai
      - publish-automation

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-api
        run: |
          uv build --package bindai-api --no-sources --out-dir dist

      - name: Publish bindai-api to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1