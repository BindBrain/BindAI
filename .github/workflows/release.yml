name: Release

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-knowledge
        run: |
          uv build --package bindai-knowledge --no-sources --out-dir dist

      - name: Publish bindai-knowledge
        uses: pypa/gh-action-pypi-publish@release/v1