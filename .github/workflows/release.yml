name: Release

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-agent
        run: |
          uv build --package bindai-agent --no-sources --out-dir dist

      - name: Build bindai
        run: |
          uv build --package bindai --no-sources --out-dir dist

      - name: Publish packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
