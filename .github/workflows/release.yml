name: Release

on:
  release:
    types:
      - published

jobs:
  publish-config:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-config
        run: |
          uv build --package bindai-config --no-sources --out-dir dist

      - name: Publish bindai-config to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-connections:
    runs-on: ubuntu-latest
    needs: publish-config

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-connections
        run: |
          uv build --package bindai-connections --no-sources --out-dir dist

      - name: Publish bindai-connections to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-memory:
    runs-on: ubuntu-latest
    needs: publish-connections

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-memory
        run: |
          uv build --package bindai-memory --no-sources --out-dir dist

      - name: Publish bindai-memory to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-knowledge:
    runs-on: ubuntu-latest
    needs: publish-memory

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-knowledge
        run: |
          uv build --package bindai-knowledge --no-sources --out-dir dist

      - name: Publish bindai-knowledge to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-workflow:
    runs-on: ubuntu-latest
    needs: publish-knowledge

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-workflow
        run: |
          uv build --package bindai-workflow --no-sources --out-dir dist

      - name: Publish bindai-workflow to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-agent:
    runs-on: ubuntu-latest
    needs: publish-workflow

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-agent
        run: |
          uv build --package bindai-agent --no-sources --out-dir dist

      - name: Publish bindai-agent to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-cli:
    runs-on: ubuntu-latest
    needs: publish-agent

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-cli
        run: |
          uv build --package bindai-cli --no-sources --out-dir dist

      - name: Publish bindai-cli to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-bindai:
    runs-on: ubuntu-latest
    needs: publish-cli

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai
        run: |
          uv build --package bindai --no-sources --out-dir dist

      - name: Publish bindai to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1