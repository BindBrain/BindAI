name: Release

on:
  release:
    types:
      - published

jobs:
  publish:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bindai-knowledge
        run: |
          uv build --package bindai-knowledge --no-sources --out-dir dist

      - name: Publish bindai-knowledge
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish dist/bindai_knowledge-0.1.3.tar.gz dist/bindai_knowledge-0.1.3-py3-none-any.whl