name: Tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:

  tests:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install BindAI Core
        run: |
          pip install -e packages/bindai-core

      - name: Install OpenAI Provider
        run: |
          pip install -e packages/providers/bindai-provider-openai

      - name: Run tests
        run: |
          pytest