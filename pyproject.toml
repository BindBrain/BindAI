[project]
name = "bindai"
version = "0.1.0"
description = "Core framework for BindAI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

authors = [
    { name = "Agim Kostari", email = "gim@bindbrain.com" }
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[tool.ruff.lint.per-file-ignores]
"packages/bindai-core/src/bindai_core/events/__init__.py" = ["F403"]
"packages/bindai-core/src/bindai_core/exceptions/__init__.py" = ["F403"]