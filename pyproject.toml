[project]
name = "bindai-workspace"
version = "0.1.0"
description = "BindAI development workspace"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "bindai",
    "bindai-cli",
    "bindai-mcp",
    "bindai-connections",
    "bindai-provider-ollama",
    "bindai-provider-openrouter",
    "chromadb>=1.5.9",
    "openai>=2.47.0",
    "psycopg[binary]>=3.2",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/bindai",
    "packages/bindai-agent",
    "packages/bindai-application",
    "packages/bindai-cli",
    "packages/bindai-config",
    "packages/bindai-core",
    "packages/bindai-embeddings",
    "packages/bindai-group",
    "packages/bindai-host",
    "packages/bindai-knowledge",
    "packages/bindai-memory",
    "packages/bindai-model",
    "packages/bindai-project",
    "packages/bindai-prompt-builder",
    "packages/bindai-prompts",
    "packages/bindai-providers",
    "packages/bindai-retrieval",
    "packages/bindai-runtime",
    "packages/bindai-task",
    "packages/bindai-tool",
    "packages/bindai-workflow",
    "packages/bindai-mcp",
    "packages/bindai-connections",
    "packages/providers/bindai-provider-openai",
    "packages/providers/bindai-provider-anthropic",
    "packages/providers/bindai-provider-ollama",
    "packages/providers/bindai-provider-openrouter",
]

[tool.uv.sources]
bindai = { workspace = true }
bindai-agent = { workspace = true }
bindai-application = { workspace = true }
bindai-cli = { workspace = true }
bindai-config = { workspace = true }
bindai-core = { workspace = true }
bindai-embeddings = { workspace = true }
bindai-group = { workspace = true }
bindai-host = { workspace = true }
bindai-knowledge = { workspace = true }
bindai-memory = { workspace = true }
bindai-model = { workspace = true }
bindai-project = { workspace = true }
bindai-prompt-builder = { workspace = true }
bindai-prompts = { workspace = true }
bindai-providers = { workspace = true }
bindai-retrieval = { workspace = true }
bindai-runtime = { workspace = true }
bindai-task = { workspace = true }
bindai-tool = { workspace = true }
bindai-workflow = { workspace = true }

bindai-provider-openai = { workspace = true }
bindai-provider-anthropic = { workspace = true }
bindai-mcp = { workspace = true }
bindai-connections = { workspace = true }
bindai-provider-ollama = { workspace = true, editable = true }
bindai-provider-openrouter = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.13.2",
    "mypy>=2.3.0",
    "pyright>=1.1.411",
    "build>=1.3.0",
    "twine>=6.2.0",
    "reportlab>=5.0.0",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"packages/bindai-core/src/bindai_core/events/__init__.py" = ["F403"]
"packages/bindai-core/src/bindai_core/exceptions/__init__.py" = ["F403"]

"packages/bindai-memory/src/bindai_memory/registry.py" = ["E402"]
"packages/bindai-retrieval/src/bindai_retrieval/registry.py" = ["E402"]
"packages/bindai-providers/src/bindai_providers/__init__.py" = ["E402"]

"packages/bindai-core/src/bindai_core/executable/executable.py" = ["UP046"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true

exclude = "(templates/|playground/|demo/)"

check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

mypy_path = [
    "packages/bindai/src",
    "packages/bindai-agent/src",
    "packages/bindai-application/src",
    "packages/bindai-cli/src",
    "packages/bindai-config/src",
    "packages/bindai-core/src",
    "packages/bindai-embeddings/src",
    "packages/bindai-group/src",
    "packages/bindai-host/src",
    "packages/bindai-knowledge/src",
    "packages/bindai-memory/src",
    "packages/bindai-model/src",
    "packages/bindai-project/src",
    "packages/bindai-prompt-builder/src",
    "packages/bindai-prompts/src",
    "packages/bindai-providers/src",
    "packages/bindai-retrieval/src",
    "packages/bindai-runtime/src",
    "packages/bindai-task/src",
    "packages/bindai-tool/src",
    "packages/bindai-workflow/src",
]

[[tool.mypy.overrides]]
module = [
    "bindai_provider_openai.*",
    "bindai_provider_anthropic.*",
    "bindai_provider_ollama.*",
]

[[tool.mypy.overrides]]
module = [
    "bindai_cli.scaffolds.*",
]
ignore_errors = true








